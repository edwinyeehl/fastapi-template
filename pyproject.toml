[project]
name = "fastapi-template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.1.1",
    "httpx>=0.28.0",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

